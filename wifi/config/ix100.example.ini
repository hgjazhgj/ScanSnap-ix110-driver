; Copy to ix100.local.ini, then fill scanner.ip and identity.wifi_manager_id.
; Fill credential.password when password_required=1.
; This program never reads ScanSnap Home files or the Windows registry.

[identity]
; Stable 8-byte host identifier, written as 16 hexadecimal characters.
; Generate one with: python src/generate_manager_id.py
wifi_manager_id=CHANGE_ME

[scanner]
ip=CHANGE_ME
control_port=53218
app_port=53219
discovery_port=52217

[credential]
password_required=1
; Plaintext connection password printed on the scanner label.
password=CHANGE_ME

[network]
timeout_seconds=30

[scan]
dpi=300
; Device output: color (24-bit), gray (8-bit), or mono (1-bit).
; Uncompressed gray/mono response format and polarity are not hardware-verified.
color_mode=color
; 1 enables edge overscan; 0 disables it.
overscan=1
max_image_mb=256
; scan_direct expands this path with strftime using local time, for example:
; output/ix100-%Y%m%d-%H%M%S-%f.bmp (use %% for a literal percent sign).
output=output/ix100_scan.bmp

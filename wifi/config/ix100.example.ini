; Copy to ix100.local.ini, then fill the four values marked CHANGE_ME.
; This program never reads ScanSnap Home files or the Windows registry.

[identity]
; Stable 8-byte host identifier, written as 16 hexadecimal characters.
; Generate one with: python src/scan_direct.py generate-manager-id
wifi_manager_id=CHANGE_ME

[scanner]
name=ScanSnap iX100
serial=CHANGE_ME
mac=CHANGE_ME
ip=192.168.1.100
control_port=53218
app_port=53219
discovery_port=52217

[credential]
password_required=1
; Plaintext connection password printed on the scanner label.
password=CHANGE_ME

[network]
timeout_seconds=30

[scan]
dpi=300
max_image_mb=100
output=output\ix100_scan.bmp
